<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usability Feedback</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            <i class="bi bi-shield-check"></i> AI Risk Analysis Tool
        </a>
        <div class="ms-auto">
            <a href="/" class="btn btn-outline-light btn-sm"><i class="bi bi-house"></i> Home</a>
        </div>
    </div>
</nav>

<div class="container py-4">
    <h3 class="fw-bold text-primary mb-3"><i class="bi bi-chat-dots"></i> Usability Feedback</h3>
    <p class="text-muted">Help us evaluate ease of use, clarity, and SME alignment.</p>

    <form method="post" class="card p-3 shadow-sm border-0 bg-white">
        <div class="row g-3">
            <div class="col-md-4">
                <label class="form-label">Name (optional)</label>
                <input class="form-control" type="text" name="name" placeholder="Your name">
            </div>
            <div class="col-md-4">
                <label class="form-label">Role (optional)</label>
                <input class="form-control" type="text" name="role" placeholder="PM, Developer, Supervisor...">
            </div>
        </div>
        <div class="row g-3 mt-1">
            <div class="col-md-4">
                <label class="form-label">Ease of Use (1–5)</label>
                <input class="form-control" type="number" name="ease" min="1" max="5" value="3">
            </div>
            <div class="col-md-4">
                <label class="form-label">Clarity of Visualizations (1–5)</label>
                <input class="form-control" type="number" name="clarity" min="1" max="5" value="3">
            </div>
            <div class="col-md-4">
                <label class="form-label">SME Alignment (1–5)</label>
                <input class="form-control" type="number" name="alignment" min="1" max="5" value="3">
            </div>
        </div>
        <div class="mt-3">
            <label class="form-label">Comments</label>
            <textarea class="form-control" name="comments" rows="4" placeholder="What worked well? What should be improved?"></textarea>
        </div>
        <div class="text-end mt-3">
            <button class="btn btn-primary"><i class="bi bi-send"></i> Submit Feedback</button>
        </div>
    </form>

    <div class="alert alert-info mt-3" role="alert">
        <i class="bi bi-people"></i> Feedback responses stored locally. Current submissions: <strong>{{ count }}</strong>
    </div>

    <div class="mt-2">
        <a class="btn btn-outline-secondary" href="/benchmark"><i class="bi bi-clipboard-data"></i> Benchmark Frameworks</a>
        <a class="btn btn-outline-secondary" href="/parameters"><i class="bi bi-sliders"></i> Parameter Scoring</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
